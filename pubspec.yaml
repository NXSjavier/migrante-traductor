name: migrante_traductor
description: Traductor Offline profesional para migrantes - Texto, Voz y Cámara
publish_to: 'none'
version: 1.1.0+11

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Cámara y OCR
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_commons: ^0.9.0

  # Voz
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1

  # Utilidades
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  crypto: ^3.0.5
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
